# CareGiver - nginx flood gate in front of the app's auth limiter
#
# The application limiter (middleware/rateLimit.js) is the real control: it knows
# the difference between a wrong password and a signed-in session. This file is
# the coarse layer in front of it, so a brute-force run is rejected before it
# reaches Node at all. Both layers answer 429.
#
# Two files change, and neither is the proxy-host .conf:
#   PART 1 -> /data/nginx/custom/http.conf      (http context, shared by all hosts)
#   PART 2 -> that host's Advanced > Custom Configuration box in the NPM UI
#
# Why not edit proxy_host/20.conf or 12.conf directly: nginx-proxy-manager
# rewrites those files from its own database every time the host is saved in the
# UI, so a hand-edit disappears silently at the next unrelated change. The two
# locations below are both re-rendered from the database and survive that.
#
# Verified against: nginx.org ngx_http_limit_req_module + ngx_http_map_module,
# nginxproxymanager.com/advanced-config, and the app version actually running
# here (jc21/nginx-proxy-manager:latest resolving to app 2.10.4).
#
# Facts these snippets depend on, from the nginx docs, that are easy to get wrong:
#   - limit_req_zone is valid in `http` context ONLY.
#   - a zone key that evaluates to an EMPTY string is not accounted at all -
#     that is what makes the POST-only limiting in PART 1 possible.
#   - limit_req is inherited from the enclosing level ONLY IF the current level
#     defines none of its own, so a location that sets limit_req must repeat
#     every zone it wants applied.
#   - the module's default rejection code is 503; limit_req_status 429 is
#     required, otherwise the edge returns a code the app never emits.

# ---------------------------------------------------------------------------
# PART 1 - create ~/npm/data/nginx/custom/http.conf on the proxy host
#          (in the container: /data/nginx/custom/http.conf, which nginx.conf
#           already includes inside `http`)
# ---------------------------------------------------------------------------

# Only the auth POST bodies are counted. A page load of /login produces an empty
# key and is therefore never throttled, so a caregiver on a shared household IP
# cannot be locked out by loading the sign-in page. The URI is compared, not a
# regex against the host, so this zone is shared safely by every proxy host -
# the bucket is per address and per URI either way.
map "$request_method:$uri" $caregiver_auth_key {
    default                     "";
    "POST:/login"               $binary_remote_addr;
    "POST:/forgot-password"     $binary_remote_addr;
    ~^POST:/reset-password      $binary_remote_addr;
}

# 10 auth POSTs per minute per address. The app allows 10 bad passwords per 15
# minutes, so this only ever trips on a fast run, not on a person fumbling.
#
# The three auth endpoints share this one bucket. That is deliberate for a flood
# gate, but the consequence is worth stating: a burst against any one of them
# refuses the others for that minute. The per-endpoint enforcement - and the
# 15-minute and 1-hour windows people actually feel - live in the app, where the
# buckets are separate and much more generous.
limit_req_zone $caregiver_auth_key zone=caregiver_auth:10m rate=10r/m;

# Coarse whole-site gate: 25 requests/second/address. Generous on purpose - the
# whole family is behind one public IP and the PWA loads a batch of assets.
limit_req_zone $binary_remote_addr zone=caregiver_global:10m rate=25r/s;

limit_req_status 429;

# ---------------------------------------------------------------------------
# PART 2 - per host: NPM UI > that host > Advanced > Custom Configuration
#          (applies to staging 20.conf first; production 12.conf later)
#
# NPM injects this box inside the host's `server { }` block, so both `limit_req`
# at server level and `location` blocks are legal here.
# ---------------------------------------------------------------------------

# limit_req_status 429;
# limit_req zone=caregiver_global burst=50 nodelay;
#
# location = /login {
#     limit_req zone=caregiver_auth   burst=5 nodelay;
#     limit_req zone=caregiver_global burst=50 nodelay;
#     include conf.d/include/proxy.conf;
# }
#
# location = /forgot-password {
#     limit_req zone=caregiver_auth   burst=5 nodelay;
#     limit_req zone=caregiver_global burst=50 nodelay;
#     include conf.d/include/proxy.conf;
# }
#
# location /reset-password {
#     limit_req zone=caregiver_auth   burst=5 nodelay;
#     limit_req zone=caregiver_global burst=50 nodelay;
#     include conf.d/include/proxy.conf;
# }

# Notes on PART 2:
#   - The server-level limit_req covers `location /`, which NPM still generates
#     itself; nothing here replaces it, so the WebSocket headers and proxy
#     settings already in that block are untouched.
#   - Each auth location repeats BOTH zones because limit_req is not inherited
#     once a level declares its own.
#   - `include conf.d/include/proxy.conf;` is what makes the location actually
#     forward to the app; omit it and /login starts answering 404.
#   - `burst=5 nodelay` means the first 6 POSTs in a minute pass immediately,
#     then they are rejected rather than queued. The app limiter is the tighter
#     bucket, so a queued request here would only add latency.
#   - proxy.conf sets its own proxy_set_header lines, which therefore do NOT
#     inherit the host's server-level Upgrade/Connection headers. CareGiver uses
#     no WebSockets, so this is inert here; a host that does would need those
#     two lines repeated inside each location.

# ---------------------------------------------------------------------------
# APPLY - staging only, first time
# ---------------------------------------------------------------------------
#
# 1. Create the file (the custom/ directory does not exist yet):
#      mkdir -p ~/npm/data/nginx/custom
#      $EDITOR ~/npm/data/nginx/custom/http.conf        # contents of PART 1
#
#    PART 1 alone enforces NOTHING. A zone that no `limit_req` references counts
#    nothing. Do not judge this change by step 6 until step 2 is in place.
#
# 2. Paste the PART 2 lines, uncommented, into the staging host's Advanced >
#    Custom Configuration box, then Save. Saving rewrites proxy_host/20.conf
#    from NPM's database - that is expected, and it is exactly why the limits
#    live in this box rather than in the file.
#
# 3. Test the whole config BEFORE reloading. Never reload on a failing test;
#    nginx keeps running with the old config in that case, but a later restart
#    would not:
#      docker exec npm-app-1 nginx -t
#
# 4. Reload only if step 3 says ok:
#      docker exec npm-app-1 nginx -s reload
#
# 5. Confirm the app is still reachable and unthrottled at human speed:
#      curl -s -o /dev/null -w '%{http_code}\n' https://caregiver-test.barrymichels.com/login
#    expect 200
#
# 6. Confirm a fast run is refused, and tell WHICH layer refused it:
#      for i in $(seq 1 40); do
#        curl -s -D /tmp/h -o /dev/null -w '%{http_code}' -X POST \
#          -H 'Content-Type: application/json' -d '{}' \
#          https://caregiver-test.barrymichels.com/login
#        grep -qi '^ratelimit-policy:' /tmp/h && printf 'app ' || printf 'nginx '
#      done; echo
#    measured on a scratch nginx with these exact zone settings: exactly 6
#    requests pass (rate plus burst, and burst=nodelay means they are not
#    queued), the remaining 34 are 429.
#
#    The layer label matters. A refusal from the APP carries a RateLimit-Policy
#    header; one from nginx does not. If every 429 says `app`, step 2 or 4 did
#    not take effect and the nginx gate is not doing anything yet.
#
# 7. Confirm recovery: wait 60s, then step 5 again should be 200.
#
# 8. Confirm the page-GET exemption actually works - this is the bit that
#    protects the household. 40 GETs of /login must all be 200:
#      for i in $(seq 1 40); do
#        printf '%s ' "$(curl -s -o /dev/null -w '%{http_code}' \
#          https://caregiver-test.barrymichels.com/login)"
#      done; echo
#    measured: 30 GETs, all 200. With an access log using
#    'log_format key $request_method $uri [$caregiver_auth_key]' you can see the
#    reason directly - POST /login shows a real address in the brackets and
#    GET /login shows [], and an empty key is never accounted.
#
# Note that steps 6 and 8 share one bucket across the three auth endpoints, so
# running step 6 immediately before another auth probe will already be refused -
# that is the shared-bucket consequence from PART 1, not a new fault. Wait 60s
# between them if you want each to start clean.
#
# If any step is wrong, the rollback is: delete or comment out the lines, run
# `docker exec npm-app-1 nginx -t`, then reload. Nothing here touches data.
#
# ---------------------------------------------------------------------------
# PRODUCTION (caregiver.barrymichels.com / proxy host 12.conf)
# ---------------------------------------------------------------------------
#
# http.conf is shared, so PART 1 is already live for production the moment it is
# created - but it does nothing on its own: with no `limit_req` referencing the
# zones, nothing is counted. Production starts enforcing only when PART 2 is
# added to that host's Advanced box. Add it there, then repeat steps 3-8 against
# https://caregiver.barrymichels.com.
#
# Do not add PART 2 to production until staging has run for a few days without
# anyone in the family complaining that sign-in refused them.
#
# To stop enforcement immediately without touching files: delete the PART 2 lines
# from the host's Advanced box and save. To stop the app limiter instead, set
# RATE_LIMITS=off in the app's .env and `docker compose up -d app` (no --build).
#
# ---------------------------------------------------------------------------
# CAVEAT: image tag drift on the proxy host
# ---------------------------------------------------------------------------
#
# The proxy runs `jc21/nginx-proxy-manager:latest`, currently resolving to app
# version 2.10.4 from an image pulled in October 2024. Two things worth knowing
# before anyone upgrades that tag: custom location blocks in the Advanced box
# were reported broken in 2.11.1 (later fixed upstream), and `docker pull` would
# move this host to a version it has never been tested on. Upgrade deliberately,
# with the same nginx -t then reload sequence, not as a side effect of something
# else.
