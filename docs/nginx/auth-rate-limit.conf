# nginx flood gate for the CareGiver auth endpoints
#
# This is the durable copy of an edit that lives on the proxy host
# (192.168.40.170), which this repository cannot reach. Apply it to:
#
#   staging    /data/nginx/proxy_host/20.conf   -> 192.168.40.173:3301
#   production /data/nginx/proxy_host/12.conf   -> 192.168.40.173:3300
#
# Read these three facts before pasting anything.
#
# 1. nginx-proxy-manager REWRITES this file from its own database every time
#    the proxy host is saved in the UI. Any hand-edit here is silently erased.
#    The durable home for these lines is the host's "Advanced" tab in the UI,
#    or a custom include - not this file. Treat an edit here as temporary and
#    re-check it after anyone touches the host.
#
# 2. A proxy-host file is `include`d inside nginx's `http` context, so
#    `limit_req_zone` is legal at the TOP of the file - above `server {`.
#    It is NOT legal inside the `server {` block; nginx -t will reject that.
#
# 3. nginx cannot match the POST verb without `if`, so plain GETs of /login
#    count against the auth budget too. The burst sizes below absorb ordinary
#    page loads. The application limiter (middleware/rateLimit.js) is the real
#    control; this layer exists to keep a flood off the app process.

# ---------------------------------------------------------------------------
# PART 1 - goes at the very top of the proxy-host file, ABOVE the `server {`
#          line (i.e. still inside the enclosing `http` context).
# ---------------------------------------------------------------------------

limit_req_zone $binary_remote_addr zone=caregiver_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=caregiver_global:10m rate=25r/s;
limit_req_status 429;

# ---------------------------------------------------------------------------
# PART 2 - goes inside the `server {` block.
#
# Add the three exact/prefix locations below, and add ONE line to the existing
# catch-all `location / { ... }` rather than replacing it - that block carries
# the Upgrade/Connection headers and `include conf.d/include/proxy.conf;` which
# the app needs for web-push and normal operation.
# ---------------------------------------------------------------------------

    location = /login {
        limit_req zone=caregiver_auth burst=5 nodelay;
        include conf.d/include/proxy.conf;
    }

    location = /forgot-password {
        limit_req zone=caregiver_auth burst=5 nodelay;
        include conf.d/include/proxy.conf;
    }

    location /reset-password {
        limit_req zone=caregiver_auth burst=5 nodelay;
        include conf.d/include/proxy.conf;
    }

    # In the EXISTING `location / { ... }`, add this single line as its first
    # directive, before the headers and the proxy.conf include:
    #
    #     limit_req zone=caregiver_global burst=50 nodelay;
    #
    # 25 r/s with a burst of 50 is deliberately loose: a whole family shares
    # one residential IP behind NAT, and a PWA pulls a lot of assets per load.
    # This only catches floods, not households.

# ---------------------------------------------------------------------------
# APPLY (operator-executed on 192.168.40.170 - no SSH access from here)
# ---------------------------------------------------------------------------
#
#   # find the container name first
#   docker ps --format '{{.Names}}' | grep -i -E 'proxy|npm'
#
#   # edit the file (or paste into the host's Advanced tab in the UI), then:
#   docker exec <npm-container> nginx -t
#   # only if the test passes:
#   docker exec <npm-container> nginx -s reload
#
# If `nginx -t` fails, revert the edit before reloading. A failed reload leaves
# the previous, working configuration in place.
#
# ---------------------------------------------------------------------------
# VERIFY (staging first; production only after staging is confirmed)
# ---------------------------------------------------------------------------
#
#   # page still serves
#   curl -s -o /dev/null -w '%{http_code}\n' https://caregiver-test.barrymichels.com/login
#   # expect: 200
#
#   # flood the auth path - expect a run of 429s, and never a 503
#   for i in $(seq 1 40); do
#     curl -s -o /dev/null -w '%{http_code} ' -X POST https://caregiver-test.barrymichels.com/login
#   done; echo
#
# Then wait ~60s and confirm the page works again.
#
# Production verification is identical against https://caregiver.barrymichels.com.
# 429 from nginx means this layer tripped; 429 with a JSON body
# {"error":"Too many attempts. ..."} means the application limiter tripped
# first, which is the normal outcome for a slow guesser.
